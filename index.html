* { margin: 0; padding: 0; box-sizing: border-box; }

<script>
const profiles = [
  { id:1, name:'Dulce', initial:'D', folder:'Dulce', gradient:'linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)' },
  { id:2, name:'Valeria', initial:'V', folder:'Valeria', gradient:'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)' },
  { id:3, name:'Camila', initial:'C', folder:'Camila', gradient:'linear-gradient(135deg, #f43f5e 0%, #fb7185 100%)' },
  { id:4, name:'Mariana', initial:'M', folder:'Mariana', gradient:'linear-gradient(135deg, #10b981 0%, #14b8a6 100%)' },
  { id:5, name:'Daniela', initial:'D', folder:'Daniela', gradient:'linear-gradient(135deg, #a855f7 0%, #6366f1 100%)' },
  { id:6, name:'Lucía', initial:'L', folder:'Lucia', gradient:'linear-gradient(135deg, #f97316 0%, #ef4444 100%)' },
  { id:7, name:'Paulina', initial:'P', folder:'Paulina', gradient:'linear-gradient(135deg, #ec4899 0%, #f97316 100%)', imageCount:33, videoCount:12 }
];

const imageGradients = [
  'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
  'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
  'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
  'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
  'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
  'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
  'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
  'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
  'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
  'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)',
  'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
  'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)'
];

const grid = document.getElementById('profiles-grid');
const modal = document.getElementById('profile-modal');
const lightbox = document.getElementById('lightbox');
const lightboxBody = document.getElementById('lightbox-body');
let currentProfile = null;

// Render profiles
function renderProfiles() {
  grid.innerHTML = profiles.map(p => `
    <article class="profile-card">
      <div class="card-avatar" style="background:${p.gradient}">
        <span class="avatar-initial">${p.initial}</span>
      </div>
      <div class="card-body">
        <h3 class="card-name">${p.name}</h3>
        <button class="btn-view" data-id="${p.id}">Ver perfil</button>
      </div>
    </article>
  `).join('');
  
  document.querySelectorAll('.btn-view').forEach(btn => {
    btn.addEventListener('click', () => openProfile(Number(btn.dataset.id)));
  });
}

function openProfile(profileId) {
  currentProfile = profiles.find(p => p.id === profileId);
  if (!currentProfile) return;
  
  document.getElementById('modal-avatar').style.background = currentProfile.gradient;
  document.getElementById('modal-avatar').textContent = currentProfile.initial;
  document.getElementById('modal-name').textContent = currentProfile.name;

  // Helper para fechas
  const formatDate = (date) => date.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });

  // Generar items con fechas (simuladas)
  const today = new Date();
  const allItems = [];

  // Images - usando fragment para fluidez
  const imagesGrid = document.getElementById('images-grid');
  imagesGrid.innerHTML = '';
  const imgFragment = document.createDocumentFragment();
  const imagesData = [];
  const imgCount = currentProfile.imageCount || 12;
  for (let i = 1; i <= imgCount; i++) {
    let imgSrc = `assets/${currentProfile.folder}/${i}.jpg`;
    // Imágenes especiales de Dulce
    if (currentProfile.folder === 'Dulce' && i === 1) {
      imgSrc = `assets/${currentProfile.folder}/IMG-20210318-WA0006.jpg`;
    }
    if (currentProfile.folder === 'Dulce' && i === 2) {
      imgSrc = `assets/${currentProfile.folder}/IMG-20210316-WA0022.jpg`;
    }
    if (currentProfile.folder === 'Dulce' && i === 3) {
      imgSrc = `assets/${currentProfile.folder}/IMG-20210314-WA0002.jpg`;
    }
    // Imágenes especiales de Paulina
    if (currentProfile.folder === 'Paulina' && i === 1) {
      imgSrc = `assets/Paulina/${encodeURIComponent('Mi Diosa😍😍😍 20210321_193744.jpg')}`;
    }
    if (currentProfile.folder === 'Paulina' && i === 2) {
      imgSrc = `assets/Paulina/IMG-20210321-WA0353.jpg`;
    }
    let date = new Date(today);
    date.setDate(today.getDate() - (i * 2 + profileId));
    // Fechas especiales para Dulce - las tres 1/4/2021 pero con orden específico
    if (currentProfile.folder === 'Dulce' && i === 1) {
      date = new Date(2021, 3, 1, 0, 0, 1); // IMG-20210318-WA0006.jpg - hasta abajo
    } else if (currentProfile.folder === 'Dulce' && i === 2) {
      date = new Date(2021, 3, 1, 0, 0, 2); // IMG-20210316-WA0022.jpg
    } else if (currentProfile.folder === 'Dulce' && i === 3) {
      date = new Date(2021, 3, 1, 0, 0, 3); // IMG-20210314-WA0002.jpg - arriba de las otras dos
    } else if (currentProfile.folder === 'Paulina' && i === 1) {
      date = new Date(2021, 2, 30, 0, 0, 1); // Mi Diosa😍😍😍 - 30/3/2021 milisegundo 1 (arriba)
    } else if (currentProfile.folder === 'Paulina' && i === 2) {
      date = new Date(2021, 2, 30, 0, 0, 2); // IMG-20210321-WA0353.jpg - 30/3/2021 milisegundo 2 (abajo)
    } else if (i === 1) {
      date = new Date(2021, 3, 1); // 1/4/2021 para otros perfiles
    }
    allItems.push({ type: 'image', index: i, src: imgSrc, date });

    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.background = currentProfile.gradient;
    div.style.backgroundImage = `url(${imgSrc})`;
    div.style.backgroundSize = 'cover';
    div.style.backgroundPosition = 'center';
    div.innerHTML = ``;
    div.addEventListener('click', () => openImageLightbox(imgSrc, i), { passive: true });
    
    imagesData.push({ div, date });
  }
  // Ordenar imágenes por fecha (más reciente arriba, más antigua abajo)
  imagesData.sort((a, b) => b.date - a.date);
  imagesData.forEach(item => imgFragment.appendChild(item.div));
  imagesGrid.appendChild(imgFragment);

  // Videos
  const videosGrid = document.getElementById('videos-grid');
  videosGrid.innerHTML = '';
  const vidFragment = document.createDocumentFragment();
  const vidCount = currentProfile.videoCount || 12;
  
  const formatDuration = (seconds) => {
    if (!seconds || isNaN(seconds)) return '--:--';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  };
  
  const videosMetadata = [];
  
  for (let i = 1; i <= vidCount; i++) {
    let videoSrc = `assets/${currentProfile.folder}/${i}.mp4`;
    // Video especial de Paulina
    if (currentProfile.folder === 'Paulina' && i === 1) {
      videoSrc = `assets/Paulina/5212331302555_status_2b6474393ff8446dbf9933a515a488e4.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 2) {
      videoSrc = `assets/Paulina/5212331302555_status_2c948168f25a4f08b9233e5139d856e9.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 3) {
      videoSrc = `assets/Paulina/5212331302555_status_6d8cc3a9f2b443978d35d47dfdfdedc3.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 4) {
      videoSrc = `assets/Paulina/VID-mmls8qby.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 5) {
      videoSrc = `assets/Paulina/VID-mmlsbere.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 6) {
      videoSrc = `assets/Paulina/5212331302555_status_f22573ab5c434d4ba60a2f748d707fc9.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 7) {
      videoSrc = `assets/Paulina/5212331302555_status_a369154501c94f64ae5478310753e743.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 8) {
      videoSrc = `assets/Paulina/5212331302555_status_6c1cc63f031544219c24201759f23163.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 9) {
      videoSrc = `assets/Paulina/5212331302555_status_88546b10a02f4fc5ae8e7bce396aebdd.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 10) {
      videoSrc = `assets/Paulina/5212331302555_status_a38e227f93f3401c9e0c4287d3f6a5e9.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 11) {
      videoSrc = `assets/Paulina/7602763206667@lid_status_b12037a20c064179b104ba9107a7c59e.mp4`;
    }
    if (currentProfile.folder === 'Paulina' && i === 12) {
      videoSrc = `assets/Paulina/SaveF.app_AQMdMmyJo8wUkTHeZyBJKy1Mdy2B-HFk1F8pE5-Jyz4JXHF7wOhVdebynKgnrll-m-zkPcUz3UrBk1NJcw5jrxc25jcU_UJSppm2gyDVt6w5kQ_720p_(HD).mp4`;
    }
    const date = new Date(today);
    date.setDate(today.getDate() - (i * 2 + profileId - 1));
    // Fechas especiales para Paulina - invertir orden como en Dulce
    if (currentProfile.folder === 'Paulina' && i === 1) {
      date.setTime(new Date(2021, 2, 30, 0, 0, 1).getTime()); // 3/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 2) {
      date.setTime(new Date(2026, 2, 3, 0, 0, 2).getTime()); // 3/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 3) {
      date.setTime(new Date(2026, 2, 10, 0, 0, 3).getTime()); // 10/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 4) {
      date.setTime(new Date(2026, 2, 11, 0, 0, 4).getTime()); // 11/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 5) {
      date.setTime(new Date(2026, 2, 11, 0, 0, 5).getTime()); // 11/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 6) {
      date.setTime(new Date(2026, 2, 11, 0, 0, 6).getTime()); // 11/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 7) {
      date.setTime(new Date(2026, 2, 15, 0, 0, 7).getTime()); // 15/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 8) {
      date.setTime(new Date(2026, 2, 17, 0, 0, 8).getTime()); // 17/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 9) {
      date.setTime(new Date(2026, 2, 23, 0, 0, 9).getTime()); // 23/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 10) {
      date.setTime(new Date(2026, 2, 24, 0, 0, 10).getTime()); // 24/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 11) {
      date.setTime(new Date(2026, 2, 26, 0, 0, 11).getTime()); // 26/3/2026
    } else if (currentProfile.folder === 'Paulina' && i === 12) {
      date.setTime(new Date(2026, 3, 5, 0, 0, 12).getTime()); // 5/4/2026
    } else if (currentProfile.folder === 'Paulina') {
      // invertir orden: video 12 más reciente
      date.setDate(today.getDate() - ((vidCount - i + 1) * 2 + profileId - 1));
    }
    allItems.push({ type: 'video', index: i, src: videoSrc, date });

    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.background = currentProfile.gradient;
    div.style.backgroundSize = 'cover';
    div.style.backgroundPosition = 'center';
    div.innerHTML = `<div class="play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><span class="thumb-number">--:--</span>`;
    div.addEventListener('click', () => openVideoLightbox(videoSrc), { passive: true });
    vidFragment.appendChild(div);
    
    // Guardar metadatos para carga sincronizada
    videosMetadata.push({ div, src: videoSrc, loaded: false });
  }
  
  // Queue secuencial para cargar miniaturas sin duplicados
  let videoLoadIndex = 0;
  const loadNextVideoMetadata = () => {
    if (videoLoadIndex >= videosMetadata.length) return;
    
    const item = videosMetadata[videoLoadIndex];
    videoLoadIndex++;
    
    if (item.loaded) {
      loadNextVideoMetadata();
      return;
    }
    
    item.loaded = true;
    
    const tempVideo = document.createElement('video');
    tempVideo.preload = 'metadata';
    tempVideo.src = item.src;
    tempVideo.muted = true;
    tempVideo.playsInline = true;
    tempVideo.crossOrigin = 'anonymous';
    tempVideo.style.display = 'none';
    document.body.appendChild(tempVideo);
    
    let completed = false;
    
    const onComplete = () => {
      if (completed) return;
      completed = true;
      try {
        tempVideo.pause();
        tempVideo.src = '';
        if (tempVideo.parentNode) tempVideo.parentNode.removeChild(tempVideo);
      } catch (e) {}
      // Mayor delay para videos lentos
      setTimeout(loadNextVideoMetadata, 200);
    };
    
    const timeoutHandle = setTimeout(() => {
      if (!completed) {
        const durationSpan = item.div.querySelector('.thumb-number');
        if (durationSpan) durationSpan.textContent = 'timeout';
        onComplete();
      }
    }, 10000); // 10 segundos timeout máximo
    
    tempVideo.addEventListener('loadedmetadata', () => {
      clearTimeout(timeoutHandle);
      const durationSpan = item.div.querySelector('.thumb-number');
      if (durationSpan && durationSpan.textContent !== 'timeout') {
        durationSpan.textContent = formatDuration(tempVideo.duration);
      }
      
      let frameCaptured = false;
      const captureFrame = () => {
        if (frameCaptured) return;
        frameCaptured = true;
        try {
          const canvas = document.createElement('canvas');
          canvas.width = tempVideo.videoWidth || 320;
          canvas.height = tempVideo.videoHeight || 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          item.div.style.backgroundImage = `url(${dataURL})`;
        } catch (e) {
          // CORS u otro error canvas: mantener gradiente, no marcar error
        }
        onComplete();
      };
      
      // Esperar a readyState >= 2 antes de seekear
      if (tempVideo.readyState >= 2) {
        try {
          tempVideo.currentTime = Math.min(1, tempVideo.duration / 4);
        } catch (e) {
          onComplete();
        }
      } else {
        tempVideo.addEventListener('loadeddata', () => {
          try {
            tempVideo.currentTime = Math.min(1, tempVideo.duration / 4);
          } catch (e) {
            onComplete();
          }
        }, { once: true });
      }
      
      tempVideo.addEventListener('seeked', captureFrame, { once: true });
    }, { once: true });
    
    tempVideo.addEventListener('error', () => {
      clearTimeout(timeoutHandle);
      // No marcar visualmente, solo completar. Video fallo pero no es catastrofico
      onComplete();
    }, { once: true });
  };
  
  // Iniciar queue después de renderizado
  setTimeout(loadNextVideoMetadata, 100);
  
  // Reordenar videos: pasar de 1-12 a 12-1 (más reciente al inicio)
  const videoChildNodes = Array.from(vidFragment.childNodes);
  videosGrid.appendChild(document.createDocumentFragment());
  videosGrid.innerHTML = '';
  videoChildNodes.reverse().forEach(node => videosGrid.appendChild(node));

  // Todo - ordenado por fecha
  const todoGrid = document.getElementById('todo-grid');
  todoGrid.innerHTML = '';
  allItems.sort((a, b) => b.date - a.date);
  const todoFragment = document.createDocumentFragment();
  const todoThumbnails = [];

  allItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'thumb';
    if (item.type === 'image') {
      div.style.background = currentProfile.gradient;
      div.style.backgroundImage = `url(${item.src})`;
      div.style.backgroundSize = 'cover';
      div.style.backgroundPosition = 'center';
      div.innerHTML = `<span class="thumb-number">${formatDate(item.date)}</span>`;
      div.addEventListener('click', () => openImageLightbox(item.src, item.index), { passive: true });
    } else {
      div.style.background = currentProfile.gradient;
      div.style.backgroundSize = 'cover';
      div.style.backgroundPosition = 'center';
      div.innerHTML = `<div class="play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><span class="thumb-number">${formatDate(item.date)}</span>`;
      div.addEventListener('click', () => openVideoLightbox(item.src), { passive: true });
      
      // Guardar para cargar en queue
      todoThumbnails.push({ div, src: item.src, loaded: false });
    }
    todoFragment.appendChild(div);
  });
  todoGrid.appendChild(todoFragment);
  
  // Queue secuencial para miniaturas de video en Tab Todo
  let todoLoadIndex = 0;
  const loadNextTodoThumbnail = () => {
    if (todoLoadIndex >= todoThumbnails.length) return;
    
    const item = todoThumbnails[todoLoadIndex];
    todoLoadIndex++;
    
    if (item.loaded) {
      loadNextTodoThumbnail();
      return;
    }
    
    item.loaded = true;
    
    const tempVideo = document.createElement('video');
    tempVideo.preload = 'metadata';
    tempVideo.src = item.src;
    tempVideo.muted = true;
    tempVideo.playsInline = true;
    tempVideo.crossOrigin = 'anonymous';
    tempVideo.style.display = 'none';
    document.body.appendChild(tempVideo);
    
    let completed = false;
    
    const onComplete = () => {
      if (completed) return;
      completed = true;
      try {
        tempVideo.pause();
        tempVideo.src = '';
        if (tempVideo.parentNode) tempVideo.parentNode.removeChild(tempVideo);
      } catch (e) {}
      setTimeout(loadNextTodoThumbnail, 200);
    };
    
    const timeoutHandle = setTimeout(() => {
      if (!completed) {
        item.div.style.opacity = '0.6';
        onComplete();
      }
    }, 10000); // 10 segundos timeout solo para timeout real
    
    tempVideo.addEventListener('loadedmetadata', () => {
      clearTimeout(timeoutHandle);
      let frameCaptured = false;
      const captureFrame = () => {
        if (frameCaptured) return;
        frameCaptured = true;
        try {
          const canvas = document.createElement('canvas');
          canvas.width = tempVideo.videoWidth || 320;
          canvas.height = tempVideo.videoHeight || 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          item.div.style.backgroundImage = `url(${dataURL})`;
        } catch (e) {
          // CORS u otro error canvas: mantener gradiente
        }
        onComplete();
      };
      
      if (tempVideo.readyState >= 2) {
        try {
          tempVideo.currentTime = Math.min(1, tempVideo.duration / 4);
        } catch (e) {
          onComplete();
        }
      } else {
        tempVideo.addEventListener('loadeddata', () => {
          try {
            tempVideo.currentTime = Math.min(1, tempVideo.duration / 4);
          } catch (e) {
            onComplete();
          }
        }, { once: true });
      }
      tempVideo.addEventListener('seeked', captureFrame, { once: true });
    }, { once: true });
    
    tempVideo.addEventListener('error', () => {
      clearTimeout(timeoutHandle);
      // No marcar visualmente, solo completar
      onComplete();
    }, { once: true });
  };
  
  // Iniciar queue después de renderizado
  if (todoThumbnails.length > 0) {
    setTimeout(loadNextTodoThumbnail, 100);
  }

  modal.classList.add('active');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  switchTab('images');
}

function closeModal() {
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
}

function openImageLightbox(src, index) {
  lightboxBody.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div class="lightbox-image" id="fs-image" style="background-image:url(${src}); background-size:contain; background-repeat:no-repeat; background-position:center; background-color:#000">
      </div>
      <button class="fullscreen-btn" id="fullscreen-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Pantalla completa
      </button>
    </div>
  `;
  lightbox.classList.add('active');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  
  // Botón pantalla completa
  setTimeout(() => {
    const btn = document.getElementById('fullscreen-btn');
    const img = document.getElementById('fs-image');
    if (btn && img) {
      btn.addEventListener('click', () => {
        if (img.requestFullscreen) {
          img.requestFullscreen();
        } else if (img.webkitRequestFullscreen) {
          img.webkitRequestFullscreen();
        } else if (img.msRequestFullscreen) {
          img.msRequestFullscreen();
        }
      }, { passive: true });
    }
  }, 50);
}

function openVideoLightbox(src) {
  lightboxBody.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div class="video-player" id="fs-video" style="width:100%;max-width:900px">
        <video src="${src}" controls autoplay playsinline preload="metadata" style="width:100%; height:auto; max-height:70vh; background:#000; border-radius:12px"></video>
      </div>
      <button class="fullscreen-btn" id="fullscreen-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Pantalla completa
      </button>
    </div>
  `;
  lightbox.classList.add('active');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  
  // Botón pantalla completa
  setTimeout(() => {
    const btn = document.getElementById('fullscreen-btn');
    const videoContainer = document.getElementById('fs-video');
    const video = videoContainer ? videoContainer.querySelector('video') : null;
    if (btn && video) {
      btn.addEventListener('click', () => {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      }, { passive: true });
    }
  }, 50);
}

function closeLightbox() {
  lightbox.classList.remove('active');
  lightbox.setAttribute('aria-hidden', 'true');
  if (!modal.classList.contains('active')) {
    document.body.style.overflow = '';
  }
}

// Theme
function initTheme() {
  const toggle = document.getElementById('theme-toggle');
  const sun = toggle.querySelector('.icon-sun');
  const moon = toggle.querySelector('.icon-moon');
  
  const saved = localStorage.getItem('pc-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  
  document.documentElement.setAttribute('data-theme', theme);
  updateIcon(theme);
  
  toggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pc-theme', next);
    updateIcon(next);
  });
  
  function updateIcon(t) {
    if (t === 'dark') {
      sun.classList.add('hidden');
      moon.classList.remove('hidden');
    } else {
      sun.classList.remove('hidden');
      moon.classList.add('hidden');
    }
  }
}

// Events
document.addEventListener('DOMContentLoaded', () => {
  renderProfiles();
  initTheme();
  
  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('#profile-modal')) closeModal();
      if (e.target.closest('#lightbox')) closeLightbox();
    });
  });
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (lightbox.classList.contains('active')) closeLightbox();
      else if (modal.classList.contains('active')) closeModal();
    }
  });
  
  modal.querySelector('.modal-backdrop').addEventListener('click', closeModal);
  lightbox.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);
});
</script>
